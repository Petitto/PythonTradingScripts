name: Deploy AWS Lambda

on:
  push:
    branches:
      - webScrapeAlgo  # Change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        uses: actions/setup-python@v5
          with:
            python-version: '3.13' 

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Dependencies
        run: |
          cd src  # Change to your function directory
          pip install -r requirements.txt -t .

      - name: Package and Deploy Lambda
        run: |
          cd src
          zip -r lambda_function.zip .
          aws lambda update-function-code --function-name automatedTradingScript --zip-file fileb://lambda_function.zip
